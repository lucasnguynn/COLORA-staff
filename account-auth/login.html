<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-src 'self' about:; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#F4EDE1">
<title>Staff Access | COLORA</title>
<link rel="stylesheet" href="/account-login.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/account-config.js" defer></script>
<script src="/account-login.js" defer></script>
</head>
<body>
<main class="access-page" id="access-page">
  <header class="brand">
    <img src="/apps/qr/assets/colora-lettermark.png" alt="COLORA" width="178" height="62">
    <span>COLOR YOUR AURA</span>
  </header>
  <section class="signin" aria-labelledby="signin-title">
    <span class="eyebrow">COLORA / STAFF WORKSPACE</span>
    <h1 id="signin-title">Welcome <em>back.</em></h1>
    <p class="intro">Đăng nhập bằng tài khoản công ty được COLORA cấp quyền.</p>
    <form id="signin-form">
      <label for="staff-email">Email công ty</label>
      <input id="staff-email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="name@colora.vn" required maxlength="254" spellcheck="false">
      <label for="staff-password">Mật khẩu Workspace</label>
      <input id="staff-password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Nhập mật khẩu">
      <button type="submit" id="signin-submit" class="primary">Đăng nhập <span aria-hidden="true">↗</span></button>
      <p class="feedback" id="signin-feedback" role="status" aria-live="polite"></p>
    </form>
    <form id="password-form" hidden>
      <p class="intro">Đặt mật khẩu riêng cho tài khoản COLORA của bạn. Vui lòng sử dụng mật khẩu từ 12 ký tự trở lên.</p>
      <label for="new-password">Mật khẩu mới</label>
      <input type="password" id="new-password" autocomplete="new-password" minlength="12" required>
      <label for="new-password-confirm">Nhập lại mật khẩu</label>
      <input type="password" id="new-password-confirm" autocomplete="new-password" minlength="12" required>
      <button type="submit" class="primary">Lưu mật khẩu và vào Workspace</button>
      <p class="feedback" id="password-feedback" aria-live="polite" role="status"></p>
    </form>
    <form id="recover-form" hidden>
      <label for="recover-email">Email công ty</label>
      <input id="recover-email" type="email" autocomplete="email" required placeholder="name@colora.vn">
      <button type="submit" class="primary">Gửi hướng dẫn đặt lại mật khẩu</button>
      <p class="feedback" id="recover-feedback" role="status" aria-live="polite"></p>
      <button type="button" class="link" id="recover-back">Quay lại đăng nhập</button>
    </form>
    <button id="recover-open" class="link" type="button">Quên mật khẩu?</button>
  </section>
  <footer class="footer"><span>INTERNAL ACCESS</span><span>COLORA - COLOR YOUR AURA</span></footer>
</main>
<div id="workspace" hidden>
 <iframe id="workspace-frame" title="COLORA Staff Workspace" referrerpolicy="no-referrer"></iframe>
 <button type="button" id="workspace-signout" aria-label="Đăng xuất khỏi Staff Workspace">Đăng xuất ↗</button>
</div>
</body></html>
