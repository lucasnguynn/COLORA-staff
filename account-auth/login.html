<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self' about:; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#F4EDE1">
<title>Staff Access | COLORA</title>
<link rel="stylesheet" href="/account-login.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/account-login.js?v=20261102-static1" defer></script>
</head>
<body>
<main class="access-page" id="access-page">
  <header class="brand">
    <img src="/apps/qr/assets/colora-lettermark.png" alt="COLORA" width="178" height="62">
    <span>COLOR YOUR AURA</span>
  </header>
  <section class="signin" aria-labelledby="signin-title">
    <span class="eyebrow">COLORA / STAFF WORKSPACE</span>
    <h1 id="signin-title">Welcome <em>back.</em></h1>
    <p class="intro">Đăng nhập bằng email công ty và mật khẩu Workspace được cấp riêng.</p>
    <form id="signin-form">
      <label for="staff-email">Email công ty</label>
      <input id="staff-email" type="email" inputmode="email" autocomplete="username" placeholder="name@colora.vn" required maxlength="254" spellcheck="false">
      <label for="staff-password">Mật khẩu Workspace</label>
      <input id="staff-password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu cá nhân">
      <button type="submit" id="signin-submit" class="primary">Đăng nhập <span aria-hidden="true">↗</span></button>
      <p class="feedback" id="signin-feedback" role="status" aria-live="polite"></p>
    </form>
    <p class="intro">Quên mật khẩu? Liên hệ quản trị COLORA để được cấp lại mật khẩu Workspace. Không sử dụng mật khẩu hộp thư BKNS.</p>
  </section>
  <footer class="footer"><span>INTERNAL ACCESS</span><span>COLORA - COLOR YOUR AURA</span></footer>
</main>
<div id="workspace" hidden>
 <iframe id="workspace-frame" title="COLORA Staff Workspace" referrerpolicy="no-referrer"></iframe>
 <button type="button" id="workspace-signout" aria-label="Đăng xuất khỏi Staff Workspace">Đăng xuất ↗</button>
</div>
</body></html>
