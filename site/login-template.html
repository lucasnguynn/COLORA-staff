  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ivory:#F4EDE1;--paper:#FFFCF8;--navy:#002451;--muted:#617187;--outline:#C8C5BE;--display:"Cormorant Garamond",Georgia,serif;--body:"Open Sans",Arial,sans-serif}
    *{box-sizing:border-box}
    html{min-height:100%;-webkit-text-size-adjust:100%}
    body{min-height:100dvh;margin:0;background:var(--ivory);color:var(--navy);font-family:var(--body);-webkit-font-smoothing:antialiased}
    .hidden{display:none!important}
    .staticrypt-content{min-height:100dvh;display:grid;place-items:center;padding:32px 18px}
    .login-panel{width:min(100%,440px);background:var(--paper);padding:clamp(32px,5vw,54px)}
    .brand-logo{display:block;width:176px;height:auto;max-width:100%;max-height:64px;object-fit:contain;object-position:left center;margin-bottom:36px}
    .staticrypt-instructions h1{font-family:var(--display);font-size:clamp(39px,4.6vw,48px);font-weight:500;line-height:1.05;letter-spacing:-.025em;margin:0 0 34px}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    .password-label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}
    .staticrypt-password-container{height:54px;position:relative;background:#fff;border:1px solid var(--outline)}
    .staticrypt-password-container:focus-within{border-color:var(--navy);box-shadow:0 0 0 2px rgba(0,36,81,.1)}
    .staticrypt-password-container input{height:100%;width:100%;border:0;outline:0;background:transparent;padding:12px 52px 12px 15px;color:var(--navy);font:400 16px var(--body)}
    .staticrypt-password-container input::placeholder{color:#8E97A0}
    .staticrypt-toggle-password-visibility{position:absolute;width:22px;height:22px;top:50%;right:16px;transform:translateY(-50%);cursor:pointer;opacity:.66}
    .staticrypt-remember{display:flex;align-items:center;gap:10px;margin:18px 0 0;font-size:12px;line-height:1.5;color:var(--muted);cursor:pointer}
    .staticrypt-remember input{width:16px;height:16px;accent-color:var(--navy);margin:0}
    .staticrypt-decrypt-button{display:block;width:100%;min-height:52px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:13px 18px;margin-top:24px;cursor:pointer;font:600 13px var(--body);transition:background-color .18s}
    .staticrypt-decrypt-button:hover{background:#153A68}
    :is(.staticrypt-decrypt-button,.staticrypt-toggle-password-visibility,.staticrypt-remember input):focus-visible{outline:2px solid var(--navy);outline-offset:3px}
    .staticrypt-spinner-container{min-height:100dvh;display:grid;place-items:center}
    .staticrypt-spinner{display:block;width:30px;height:30px;border:2px solid #D5CFC5;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:520px){.staticrypt-content{padding:20px 14px}.login-panel{padding:36px 28px}.brand-logo{width:157px;margin-bottom:30px}.staticrypt-instructions h1{font-size:41px;margin-bottom:30px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:.01ms!important}}
  </style>
</head>

        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",

                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                    alert(templateError);

  <script>
    const pwVisibility = document.querySelector(".staticrypt-toggle-password-visibility");
    pwVisibility?.setAttribute("tabindex", "0");
    pwVisibility?.setAttribute("role", "button");
    pwVisibility?.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); pwVisibility.click(); }
    });
  </script>
