<!doctype html>
<html class="staticrypt-html" lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F4EDE1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="cache-control" content="no-store, max-age=0">
  <title>/*[|template_title|]*/0 | COLORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Warm up public Staff CSS on the login screen before StatiCrypt swaps HTML. -->
  <link rel="preload" href="/styles.css" as="style">
  <link rel="preload" href="/brand-refinements.css" as="style">
  <style>
    :root {
      --ivory: #F4EDE1; --paper:#FFFCF8; --navy:#002451;
      --gold:#B08A5B; --muted:#65738A; --line:#D7CDBF;
      --display:"Cormorant Garamond",Georgia,serif;
      --body:"Open Sans",Arial,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{min-height:100%;-webkit-text-size-adjust:100%}
    body{min-height:100dvh;margin:0;background:var(--ivory);color:var(--navy);font-family:var(--body);-webkit-font-smoothing:antialiased}
    .hidden{display:none!important}
    .staticrypt-content{min-height:100dvh;display:grid;place-items:center;padding:36px 22px}
    .login-panel{
      display:grid;grid-template-columns:minmax(270px,0.87fr) minmax(0,1.13fr);
      width:min(900px,100%);min-height:478px;background:var(--paper);
      border:1px solid #E0D8CD;box-shadow:0 12px 38px rgba(0,36,81,.055);
    }
    .brand-side{
      display:flex;align-items:center;justify-content:center;
      padding:46px 32px;min-width:0;background:var(--navy);color:var(--ivory);
    }
    .brand-lockup{display:flex;flex-direction:column;align-items:center;gap:21px;width:100%}
    .brand-logo{
      display:block;width:min(234px,100%);height:auto;max-height:86px;
      object-fit:contain;object-position:center;
      filter:brightness(0) invert(1)
    }
    .brand-line{font:600 10px/1.5 var(--body);letter-spacing:.22em;color:#D5C0A1;text-align:center}
    .access-side{
      display:flex;flex-direction:column;justify-content:center;min-width:0;
      padding:clamp(42px,5vw,64px) clamp(35px,5.2vw,67px);
    }
    .staticrypt-instructions h1{
      font-family:var(--display);font-size:clamp(43px,4.2vw,54px);
      font-weight:500;line-height:1.04;letter-spacing:-.02em;margin:0 0 10px;
    }
    .access-intro{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 34px}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    .password-label{display:block;font-size:13px;font-weight:600;margin:0 0 10px}
    .staticrypt-password-container{height:54px;position:relative;background:#fff;border:1px solid #C5C9CC}
    .staticrypt-password-container:focus-within{border-color:var(--navy);box-shadow:0 0 0 2px rgba(0,36,81,.1)}
    .staticrypt-password-container input{width:100%;height:100%;border:0;outline:0;background:transparent;padding:12px 52px 12px 15px;color:var(--navy);font:400 16px var(--body)}
    .staticrypt-password-container input::placeholder{color:#8E97A0}
    .staticrypt-toggle-password-visibility{position:absolute;width:22px;height:22px;top:50%;right:16px;transform:translateY(-50%);cursor:pointer;opacity:.66}
    .staticrypt-remember{display:flex;align-items:center;gap:9px;margin:17px 0 0;font-size:12px;line-height:1.5;color:var(--muted);cursor:pointer}
    .staticrypt-remember input{width:16px;height:16px;margin:0;accent-color:var(--navy)}
    .staticrypt-decrypt-button{
      display:block;width:100%;min-height:52px;border:1px solid var(--navy);
      background:var(--navy);color:#fff;padding:13px 18px;
      margin-top:24px;cursor:pointer;font:600 13px var(--body);
      transition:background-color .18s;
    }
    .staticrypt-decrypt-button:hover{background:#153A68}
    :is(.staticrypt-decrypt-button,.staticrypt-toggle-password-visibility,.staticrypt-remember input):focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    .staticrypt-spinner-container{min-height:100dvh;display:grid;place-items:center}
    .staticrypt-spinner{width:30px;height:30px;border:2px solid #D5CFC5;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:720px){
      .staticrypt-content{padding:22px 16px}
      .login-panel{grid-template-columns:1fr;width:min(470px,100%);min-height:0}
      .brand-side{padding:27px 22px 26px}
      .brand-lockup{gap:11px}
      .brand-logo{width:177px;max-height:66px}
      .brand-line{font-size:9px;letter-spacing:.18em}
      .access-side{padding:37px 35px 43px}
      .staticrypt-instructions h1{font-size:46px}
      .access-intro{margin-bottom:29px}
    }
    @media(max-width:420px){
      .staticrypt-content{padding:15px 12px}
      .brand-side{padding:23px 20px}
      .access-side{padding:34px 26px 38px}
      .staticrypt-instructions h1{font-size:42px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
  </style>
</head>
<body class="staticrypt-body">

        </form>
      </div>
    </main>
  </div>
        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            // you can edit these values to customize some of the behavior of StatiCrypt
            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

            const imgSrcEyeOpened =

                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                // A stable branded loading state bridges password validation
                // and the protected document's own inline first-paint guard.
                const content = document.getElementById("staticrypt_content");
                const loading = document.getElementById("staticrypt_loading");
                content.classList.add("hidden");
                loading.classList.remove("hidden");
                let isSuccessful = false;
                try {
                    ({ isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked));
                } catch (error) {
                    // Do not expose decryption details or password material.
                    isSuccessful = false;
                }
                if (!isSuccessful) {
                    loading.classList.add("hidden");
                    content.classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                    alert(templateError);
                }

  <script>
    const pwVisibility = document.querySelector(".staticrypt-toggle-password-visibility");
    pwVisibility?.setAttribute("tabindex", "0");
    pwVisibility?.setAttribute("role", "button");
    pwVisibility?.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); pwVisibility.click(); }
    });
  </script>
