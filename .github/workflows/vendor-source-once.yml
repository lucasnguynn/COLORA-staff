name: Snapshot original apps into COLORA-staff (one time)
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: colora-source-migration
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      deployment: false
    steps:
      - name: Checkout integration branch, but authorize this run from main
        uses: actions/checkout@v4
        with:
          ref: feature/self-contained-staff-source
          persist-credentials: true
      - name: Checkout CSKH-COLORA once
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/CSKH-COLORA
          path: .migration/client-care
          persist-credentials: false
      - name: Checkout QnA-COLORA once
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/QnA-COLORA
          path: .migration/learning
          persist-credentials: false
      - name: Checkout QR-V1 once
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/QR-V1
          path: .migration/qr
          persist-credentials: false
      - name: Checkout COLORA-JD once (temporary, uncommitted)
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/COLORA-JD
          path: .migration/jd
          persist-credentials: false
          token: ${{ secrets.SENIOR_SOURCE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy full original app source snapshots into this repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p modules/client-care modules/learning modules/qr
          for name in client-care learning qr; do
            rsync -a --delete \
              --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
              --exclude='.env' --exclude='.env.*' --exclude='.DS_Store' \
              ".migration/$name/" "modules/$name/"
          done
          test -s modules/client-care/index.html
          test -s modules/client-care/app.js
          test -s modules/learning/data/questions.json
          test -s modules/learning/data/essentials-review.json
          test -s modules/qr/index.html
          test -s modules/qr/assets/colora-logo.png
          echo "App source code and runtime assets copied, including full training data and tests."
      - name: Seal complete COLORA-JD source into encrypted local archive
        env:
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C .migration/jd \
            --exclude=.git --exclude=.github --exclude=node_modules \
            --exclude=.env --exclude=.env.local \
            -czf "$RUNNER_TEMP/colora-jd-source.tar.gz" .
          node scripts/jd-source.mjs encrypt "$RUNNER_TEMP/colora-jd-source.tar.gz" modules/jd-source.enc.json
          node scripts/jd-source.mjs decrypt modules/jd-source.enc.json .sources/jd
          test -s .sources/jd/app.js
          test -s .sources/jd/assets/colora-logo-navy.png
          rm -rf .sources/jd .migration/jd
          echo "JD source encrypted; plaintext removed from build workspace."
      - name: Commit app snapshots only, never the original JD plaintext
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/client-care modules/learning modules/qr modules/jd-source.enc.json
          if git diff --cached --quiet; then
            echo "All source snapshots are already current."
          else
            git commit -m "chore: snapshot full QnA, CSKH, QR and encrypted JD sources into Staff"
            git push origin HEAD:feature/self-contained-staff-source
          fi
