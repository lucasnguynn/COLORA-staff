name: Validate COLORA Staff Portal
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lucasnguynn/CSKH-COLORA
          path: .sources/client-care
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lucasnguynn/QnA-COLORA
          path: .sources/learning
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lucasnguynn/QR-V1
          path: .sources/qr
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lucasnguynn/COLORA-JD
          path: .sources/jd
          persist-credentials: false
          token: ${{ secrets.SENIOR_SOURCE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check site/app.js
          node --check site/library.js
          node --check site/library-ui.js
          node --check tests/ui.mjs
          node --check scripts/build.mjs
          node --check scripts/encrypt.mjs
          node --check scripts/preflight.mjs
          node --check scripts/verify.mjs
          (cd .sources/learning && node scripts/validate.mjs)
          (cd .sources/client-care && node tests/publication.cjs && node tests/ops.cjs && node tests/smoke.cjs)
      - name: Validate password preflight using disposable test secrets
        env:
          STAFF_PORTAL_PASSWORD: CI-STAFF-DEMO-DO-NOT-SHARE-2026
          SENIOR_JD_PASSWORD: CI-SENIOR-DEMO-DO-NOT-SHARE-2026
        run: node scripts/preflight.mjs
      - name: Verify incomplete password setup fails safely
        env:
          STAFF_PORTAL_PASSWORD: ""
          SENIOR_JD_PASSWORD: CI-SENIOR-DEMO-DO-NOT-SHARE-2026
        run: |
          if node scripts/preflight.mjs; then
            echo "Preflight unexpectedly accepted a missing staff secret"
            exit 1
          fi
      - run: npm install --no-save --no-package-lock staticrypt@3.5.4 playwright@1.56.1
      - run: node scripts/build.mjs
      - name: Install browser for UI smoke tests
        run: npx playwright install chromium
      - name: Test desktop, mobile and embedded tools
        run: node tests/ui.mjs
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colora-staff-ui-qa
          path: test-results/
          if-no-files-found: ignore
      - name: Encryption smoke test (demo passwords, NO deploy)
        env:
          STAFF_PORTAL_PASSWORD: CI-STAFF-DEMO-DO-NOT-SHARE-2026
          SENIOR_JD_PASSWORD: CI-SENIOR-DEMO-DO-NOT-SHARE-2026
        run: node scripts/encrypt.mjs && node scripts/verify.mjs
