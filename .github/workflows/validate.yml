name: Validate COLORA Staff Portal
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Block accidental secret material in tracked repository content
        run: node scripts/security-audit.mjs
      - name: Validate JavaScript
        run: |
          node --check scripts/security-audit.mjs
          node --check scripts/build-quick-search.mjs
          node --check site/quick-search.js
          node --check site/operations-data.js
          node --check site/operations.js
          node tests/operations.mjs
          node --check tests/quick-search-index.mjs
          node tests/quick-search-index.mjs
          node --check site/app.js
          node --check site/mail-guide.js
          node --check site/email-templates.js
          node tests/email-edition.mjs
          node --check site/jd-workspace.js
          node --check account-auth/account-login.js
          node --check scripts/build-account-release.mjs
          node --check scripts/account-roster.mjs
          node tests/account-roster.mjs
          node --check tests/account-release.mjs
          node --check tests/static-login.mjs
          node --check tests/remember-deploy-stability.mjs
          node --check tests/published-asset-audit.mjs
          node --check tests/live-password-check.mjs
          node --check tests/account-secret-diagnostics.mjs
          node tests/account-secret-diagnostics.mjs
          node --check site/library.js
          node --check site/library-ui.js
          node --check tests/ui.mjs
          node --check tests/encrypted-login.mjs
          node --check scripts/build.mjs
          node --check scripts/encrypt.mjs
          node --check scripts/preflight.mjs
          node --check scripts/jd-source.mjs
          node --check scripts/recover-jd-source.mjs
          node --check scripts/verify.mjs
          (cd modules/learning && node scripts/validate.mjs)
          (cd modules/client-care && node tests/publication.cjs && node tests/ops.cjs && node tests/smoke.cjs)
      - name: Verify immutable pinned JD fallback can be recovered without a secret
        run: |
          node scripts/recover-jd-source.mjs .sources/jd-pin-smoke
          test -f .sources/jd-pin-smoke/index.html
          rm -rf .sources/jd-pin-smoke
      - name: Validate password preflight using disposable test secrets
        env:
          STAFF_PORTAL_PASSWORD: CI-STAFF-DEMO-DO-NOT-SHARE-2026
          SENIOR_JD_PASSWORD: CI-SENIOR-DEMO-DO-NOT-SHARE-2026
        run: node scripts/preflight.mjs
      - name: Verify eight-character passwords are accepted
        env:
          STAFF_PORTAL_PASSWORD: "Test8!Aa"
          SENIOR_JD_PASSWORD: "Test8!Bb"
        run: node scripts/preflight.mjs
      - name: Verify seven-character passwords are rejected
        env:
          STAFF_PORTAL_PASSWORD: "Test7!A"
          SENIOR_JD_PASSWORD: "Test8!Bb"
        run: |
          if node scripts/preflight.mjs; then
            echo "Preflight unexpectedly accepted a seven-character password"
            exit 1
          fi
      - name: Verify incomplete password setup fails safely
        env:
          STAFF_PORTAL_PASSWORD: ""
          SENIOR_JD_PASSWORD: CI-SENIOR-DEMO-DO-NOT-SHARE-2026
        run: |
          if node scripts/preflight.mjs; then
            echo "Preflight unexpectedly accepted a missing staff secret"
            exit 1
          fi
      - run: npm install --no-save --no-package-lock staticrypt@3.5.4 playwright@1.56.1 qr-code-styling@1.6.0-rc.1 jsqr@1.4.0 pngjs@7.0.0
      - name: Build with synthetic JD fixture (no privileged secrets in PR CI)
        env:
          JD_SOURCE_DIR: tests/fixtures/jd
          COLORA_JD_SCOPED_STORAGE: 'true'
        run: node scripts/build.mjs
      - name: Build and verify five encrypted accounts with disposable CI identities (not real employees)
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: '[{"email":"ci-staff-one@colora.vn","password":"Ci000001","role":"staff"},{"email":"ci-staff-two@colora.vn","password":"Ci000002","role":"staff"},{"email":"ci-staff-three@colora.vn","password":"Ci000003","role":"staff"},{"email":"ci-senior-one@colora.vn","password":"Ci000004","role":"senior"},{"email":"ci-senior-two@colora.vn","password":"Ci000005","role":"senior"}]'
        run: |
          node scripts/build-account-release.mjs
          node tests/account-release.mjs
          node tests/published-asset-audit.mjs
          # Simulate a second deployment with UNCHANGED credentials. Previous
          # random salts/IDs must remain valid; new AES-GCM IVs must rotate.
          cp account-release/public/account-entries.json /tmp/colora-prev-entries.json
          cp -r account-release/public/account-files /tmp/colora-prev-envelopes
          COLORA_PREVIOUS_ACCOUNT_MANIFEST_PATH=/tmp/colora-prev-entries.json node scripts/build-account-release.mjs
          node tests/remember-deploy-stability.mjs /tmp/colora-prev-entries.json /tmp/colora-prev-envelopes
          node tests/account-release.mjs
      - name: Install browser for UI smoke tests
        run: npx playwright install chromium
      # The five disposable credentials above are intentionally EXACTLY eight
      # characters long. Both encryption and browser login must work at the
      # configured minimum, with seven-character rejection tested separately.
      - name: End-to-end static login with disposable Staff and Senior accounts
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: '[{"email":"ci-staff-one@colora.vn","password":"Ci000001","role":"staff"},{"email":"ci-staff-two@colora.vn","password":"Ci000002","role":"staff"},{"email":"ci-staff-three@colora.vn","password":"Ci000003","role":"staff"},{"email":"ci-senior-one@colora.vn","password":"Ci000004","role":"senior"},{"email":"ci-senior-two@colora.vn","password":"Ci000005","role":"senior"}]'
        run: |
          node tests/static-login.mjs
          rm -rf account-release
      - name: Test desktop, mobile and embedded tools
        run: node tests/ui.mjs
      - name: Verify optional sixth Staff account with disposable credentials
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: '[{"email":"ci-staff-one@colora.vn","password":"Ci000001","role":"staff"},{"email":"ci-staff-two@colora.vn","password":"Ci000002","role":"staff"},{"email":"ci-staff-three@colora.vn","password":"Ci000003","role":"staff"},{"email":"ci-senior-one@colora.vn","password":"Ci000004","role":"senior"},{"email":"ci-senior-two@colora.vn","password":"Ci000005","role":"senior"}]'
          COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON: '{"email":"ci-staff-added@colora.vn","password":"Synthetic-Test-Secret-006","role":"staff"}'
          COLORA_PREVIOUS_ACCOUNT_MANIFEST_PATH: /tmp/colora-prev-entries.json
        run: |
          node scripts/build-account-release.mjs
          node tests/account-release.mjs
          node tests/published-asset-audit.mjs
          node -e 'const fs=require("node:fs");const old=JSON.parse(fs.readFileSync("/tmp/colora-prev-entries.json"));const current=JSON.parse(fs.readFileSync("account-release/public/account-entries.json"));if(current.entries.length!==6||old.entries.some((e,i)=>e.id!==current.entries[i].id||e.salt!==current.entries[i].salt))process.exit(1);console.log("PASS: previous five account IDs and salts preserved when sixth Staff is added")'
          node tests/static-login.mjs
          rm -rf account-release
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colora-staff-ui-qa
          path: test-results/
          if-no-files-found: ignore
      - name: Encryption smoke test (demo passwords, NO deploy)
        env:
          STAFF_PORTAL_PASSWORD: "Test8!Aa"
          SENIOR_JD_PASSWORD: "Test8!Bb"
        run: node scripts/encrypt.mjs && node scripts/verify.mjs
      - name: Verify branded Staff + Senior login on desktop/mobile
        env:
          STAFF_PORTAL_PASSWORD: "Test8!Aa"
          SENIOR_JD_PASSWORD: "Test8!Bb"
          LOGIN_QA_SCREENSHOTS: '1'
        run: node tests/encrypted-login.mjs
      # Two-role login is validated by encrypted-login.mjs with disposable
      # Staff and Senior secrets. Preserving a stale JD envelope is no longer
      # allowed because Senior must access JD in the same workspace session.
      - name: Save branded login screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colora-login-ui-qa
          path: test-results/login-*.png
          if-no-files-found: ignore
