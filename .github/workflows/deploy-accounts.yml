name: Deploy COLORA individual encrypted accounts (opt-in)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: colora-staff-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    if: vars.STAFF_AUTH_MODE == 'static-accounts'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore protected JD source without exposing a password
        env:
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        shell: bash
        run: |
          if node scripts/jd-source.mjs decrypt modules/jd-source.enc.json .sources/jd; then
            echo "JD source restored."
          else
            rm -rf .sources/jd
            node scripts/recover-jd-source.mjs .sources/jd
          fi
      - name: Install pinned QR dependency
        run: npm install --no-save --no-package-lock qr-code-styling@1.6.0-rc.1 playwright@1.56.1
      - name: Build Staff and Senior plaintext in temporary runner ONLY
        run: node scripts/build.mjs
      - name: Encrypt five independent email-password envelopes
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.COLORA_ACCOUNT_CREDENTIALS_JSON }}
        run: node scripts/build-account-release.mjs
      - name: Assert correct role decryption and no private plaintext exposure
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.COLORA_ACCOUNT_CREDENTIALS_JSON }}
        run: node tests/account-release.mjs
      - name: Install browser for real encrypted five-user login tests
        run: npx playwright install chromium
      - name: Verify employee-specific login and Staff JD denial
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.COLORA_ACCOUNT_CREDENTIALS_JSON }}
        run: node tests/static-login.mjs
      - name: Erase staging plaintext and private test fixtures
        run: |
          rm -rf dist .sources
          test -f account-release/public/index.html
          test ! -e account-release/public/apps/jd/index.html
          test ! -e account-release/public/senior-gateway.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: account-release/public
      - name: Publish encrypted five-person login, never plaintext
        id: deployment
        uses: actions/deploy-pages@v4
