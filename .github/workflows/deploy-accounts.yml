name: Deploy COLORA individual encrypted accounts (opt-in)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: colora-staff-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.STAFF_AUTH_MODE == 'static-accounts'
    runs-on: ubuntu-latest
    # Secrets are available ONLY in this build job. No Pages deployment
    # privileges or OIDC token are granted while decrypting source material.
    permissions:
      contents: read
    environment:
      name: github-pages
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked sources for accidental credentials before reading production secrets
        run: node scripts/security-audit.mjs
      - name: Validate source safety and training integrity before encrypting
        run: |
          node --check scripts/security-audit.mjs
          node --check scripts/build.mjs
          node --check scripts/build-account-release.mjs
          node --check account-auth/account-login.js
          node --check site/app.js
          node --check site/email-templates.js
          node tests/email-edition.mjs
          node --check site/operations-data.js
          node --check site/operations.js
          node tests/operations.mjs
          node --check site/module-host.js
          node --check site/jd-workspace.js
          node --check tests/live-password-check.mjs
          node tests/account-secret-diagnostics.mjs
          (cd modules/learning && node scripts/validate.mjs)
          (cd modules/client-care && node tests/publication.cjs && node tests/ops.cjs && node tests/smoke.cjs)
      - name: Restore protected JD source without exposing a password
        env:
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        shell: bash
        run: |
          if node scripts/jd-source.mjs decrypt modules/jd-source.enc.json .sources/jd; then
            echo "JD source restored."
          else
            rm -rf .sources/jd
            echo "::warning title=JD archive key mismatch::The stored encrypted JD archive does not match SENIOR_JD_PASSWORD. Using the reviewed pinned JD source fallback. This may omit browser-local edits. Rekey the archive using the dedicated rotation workflow when the previous key is available."
            node scripts/recover-jd-source.mjs .sources/jd
          fi
      - name: Install pinned QR dependency
        run: npm install --no-save --no-package-lock qr-code-styling@1.6.0-rc.1 playwright@1.56.1 jsqr@1.4.0 pngjs@7.0.0
      - name: Build Staff and Senior plaintext in temporary runner ONLY
        env:
          COLORA_JD_SCOPED_STORAGE: 'true'
        run: node scripts/build.mjs
      - name: Encrypt protected individual email-password envelopes
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.COLORA_ACCOUNT_CREDENTIALS_JSON }}
          COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON: ${{ secrets.COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON }}
          # Only the five public opaque salt/verifier/ID records are fetched.
          # Reuse each record only when the owner-supplied email+password still
          # matches; new ciphertext always gets a fresh random AES-GCM IV.
          COLORA_REUSE_DEPLOYED_ACCOUNTS: 'true'
        run: node scripts/build-account-release.mjs
      - name: Assert correct role decryption and no private plaintext exposure
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.COLORA_ACCOUNT_CREDENTIALS_JSON }}
          COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON: ${{ secrets.COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON }}
        run: node tests/account-release.mjs
      - name: Install browser for real encrypted five-user login tests
        run: npx playwright install chromium
      - name: Verify employee-specific login and Staff JD denial
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.COLORA_ACCOUNT_CREDENTIALS_JSON }}
          COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON: ${{ secrets.COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON }}
        run: node tests/static-login.mjs
      - name: Validate desktop, mobile and embedded Staff/JD tools before publishing
        run: node tests/ui.mjs
      - name: Check public artifact allowlist and absence of private sources
        run: node tests/published-asset-audit.mjs
      - name: Erase staging plaintext and private test fixtures
        run: |
          rm -rf dist .sources
          test -f account-release/public/index.html
          test ! -e account-release/public/apps/jd/index.html
          test ! -e account-release/public/senior-gateway.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: account-release/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: vars.STAFF_AUTH_MODE == 'static-accounts'
    # Only this isolated job can publish the already-verified Pages artifact.
    # It never checks out code or has employee/JD secrets in its environment.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish encrypted Staff and Senior accounts, never plaintext
        id: deployment
        uses: actions/deploy-pages@v4
