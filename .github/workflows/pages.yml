name: Deploy COLORA Staff Portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: colora-staff-pages
  cancel-in-progress: false
jobs:
  build:
    # Once individual accounts are activated, never overwrite their gateway
    # with the old shared-password StatiCrypt portal on the next commit.
    # Explicit rollback only. A missing/incorrect auth mode MUST NOT
    # silently deploy the obsolete shared-password login.
    if: vars.STAFF_AUTH_MODE == 'legacy' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # github-pages secrets stored in Settings > Environments can only be
    # read by a job that explicitly references this environment.
    environment:
      name: github-pages
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - name: Check staff passwords are accessible before build
        env:
          STAFF_PORTAL_PASSWORD: ${{ secrets.STAFF_PORTAL_PASSWORD }}
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        run: node scripts/preflight.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate archived source in this repository
        run: |
          (cd modules/learning && node scripts/validate.mjs)
          (cd modules/client-care && node tests/publication.cjs && node tests/ops.cjs && node tests/smoke.cjs)
      - name: Restore pinned JD source if Senior archive password was rotated
        env:
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        shell: bash
        run: |
          # Keep the existing encrypted archive untouched. If the secret was
          # rotated without rekeying it, restore the exact reviewed historical
          # source from the owner's original public repository and encrypt the
          # JD page with the CURRENT Senior secret during this build.
          if node scripts/jd-source.mjs decrypt modules/jd-source.enc.json .sources/jd; then
            echo "JD source archive matches configured Senior secret."
          else
            rm -rf .sources/jd
            echo "::warning::Previous JD source archive key mismatch. Rebuilding from pinned original COLORA-JD source under current Senior secret."
            node scripts/recover-jd-source.mjs .sources/jd
          fi
          echo "JD_BUILD_MODE=fresh" >> "$GITHUB_ENV"
      - name: Install pinned StatiCrypt and browser test runner
        run: npm install --no-save --no-package-lock staticrypt@3.5.4 playwright@1.56.1 qr-code-styling@1.6.0-rc.1
      - name: Assemble static portal
        run: node scripts/build.mjs
      - name: Encrypt ALL HTML pages before publishing
        env:
          STAFF_PORTAL_PASSWORD: ${{ secrets.STAFF_PORTAL_PASSWORD }}
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        run: node scripts/encrypt.mjs
      - name: Verify no plaintext JD or unencrypted pages
        run: node scripts/verify.mjs
      - name: Install Chromium for encrypted login checks
        run: npx playwright install chromium
      - name: Test real staff and senior passwords against encrypted output
        env:
          STAFF_PORTAL_PASSWORD: ${{ secrets.STAFF_PORTAL_PASSWORD }}
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        run: node tests/encrypted-login.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages configuration before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          HTTP_STATUS=$(curl -sS -o "$RUNNER_TEMP/pages-site-response.json" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Unable to read current Pages site (HTTP $HTTP_STATUS)."
            exit 1
          fi
          python3 -c 'import json,sys; j=json.load(open(sys.argv[1])); print("Pages configuration:",json.dumps({"build_type":j.get("build_type"),"status":j.get("status"),"cname":j.get("cname"),"https_enforced":j.get("https_enforced"),"https_certificate_state":(j.get("https_certificate") or {}).get("state"),"source":j.get("source")},ensure_ascii=False));' "$RUNNER_TEMP/pages-site-response.json"
      - name: Deploy published-only artifact
        uses: actions/deploy-pages@v4
        id: deployment
