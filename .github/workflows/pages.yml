name: Deploy COLORA Staff Portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: colora-staff-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # github-pages secrets stored in Settings > Environments can only be
    # read by a job that explicitly references this environment.
    environment:
      name: github-pages
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - name: Check staff passwords are accessible before build
        env:
          STAFF_PORTAL_PASSWORD: ${{ secrets.STAFF_PORTAL_PASSWORD }}
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        run: node scripts/preflight.mjs
      - name: Checkout Client Care Academy
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/CSKH-COLORA
          path: .sources/client-care
          persist-credentials: false
      - name: Checkout Learning Studio
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/QnA-COLORA
          path: .sources/learning
          persist-credentials: false
      - name: Checkout QR Generator
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/QR-V1
          path: .sources/qr
          persist-credentials: false
      - name: Checkout JD Library
        uses: actions/checkout@v4
        with:
          repository: lucasnguynn/COLORA-JD
          path: .sources/jd
          persist-credentials: false
          token: ${{ secrets.SENIOR_SOURCE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate integrated learning repositories
        run: |
          (cd .sources/learning && node scripts/validate.mjs)
          (cd .sources/client-care && node tests/publication.cjs && node tests/ops.cjs && node tests/smoke.cjs)
      - name: Install pinned StatiCrypt and browser test runner
        run: npm install --no-save --no-package-lock staticrypt@3.5.4 playwright@1.56.1
      - name: Assemble static portal
        run: node scripts/build.mjs
      - name: Encrypt ALL HTML pages before publishing
        env:
          STAFF_PORTAL_PASSWORD: ${{ secrets.STAFF_PORTAL_PASSWORD }}
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        run: node scripts/encrypt.mjs
      - name: Verify no plaintext JD or unencrypted pages
        run: node scripts/verify.mjs
      - name: Install Chromium for encrypted login checks
        run: npx playwright install chromium
      - name: Test real staff and senior passwords against encrypted output
        env:
          STAFF_PORTAL_PASSWORD: ${{ secrets.STAFF_PORTAL_PASSWORD }}
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        run: node tests/encrypted-login.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages configuration before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          HTTP_STATUS=$(curl -sS -o "$RUNNER_TEMP/pages-site-response.json" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Unable to read current Pages site (HTTP $HTTP_STATUS)."
            exit 1
          fi
          python3 -c 'import json,sys; j=json.load(open(sys.argv[1])); print("Pages configuration:",json.dumps({"build_type":j.get("build_type"),"status":j.get("status"),"cname":j.get("cname"),"https_enforced":j.get("https_enforced"),"https_certificate_state":(j.get("https_certificate") or {}).get("state"),"source":j.get("source")},ensure_ascii=False));' "$RUNNER_TEMP/pages-site-response.json"
      - name: Deploy published-only artifact
        uses: actions/deploy-pages@v4
        id: deployment
