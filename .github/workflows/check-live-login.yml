name: Check LIVE COLORA Staff account login after deployment
on:
  workflow_run:
    workflows: ["Deploy COLORA individual encrypted accounts (opt-in)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    # Never run against a failed/cancelled deployment or a pull request.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Confirm deployed Staff/Senior login and role isolation (no credential logs)
        env:
          COLORA_ACCOUNT_CREDENTIALS_JSON: ${{ secrets.COLORA_ACCOUNT_CREDENTIALS_JSON }}
          COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON: ${{ secrets.COLORA_ADDITIONAL_STAFF_CREDENTIALS_JSON }}
          EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tests/live-password-check.mjs
