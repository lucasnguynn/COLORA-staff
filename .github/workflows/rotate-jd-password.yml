name: Rekey encrypted Senior JD snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: colora-jd-rekey
  cancel-in-progress: false
jobs:
  rekey:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check presence of both keys without revealing secrets
        env:
          OLD_KEY: ${{ secrets.SENIOR_JD_PASSWORD_PREVIOUS }}
          NEW_KEY: ${{ secrets.SENIOR_JD_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$OLD_KEY" ] || [ -z "$NEW_KEY" ]; then
            echo "::error::Both SENIOR_JD_PASSWORD_PREVIOUS and SENIOR_JD_PASSWORD must be set as github-pages environment secrets."
            exit 1
          fi
          if [ "$OLD_KEY" = "$NEW_KEY" ]; then
            echo "::error::The previous and current Senior keys must differ."
            exit 1
          fi
          if [ "${#OLD_KEY}" -lt 8 ] || [ "${#NEW_KEY}" -lt 8 ]; then
            echo "::error::The keys must meet the eight-character minimum."
            exit 1
          fi
      - name: Unlock exact protected archive with previous key
        env:
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD_PREVIOUS }}
        run: node scripts/jd-source.mjs decrypt modules/jd-source.enc.json .sources/jd
      - name: Re-encrypt archive with current key and verify decrypt
        env:
          SENIOR_JD_PASSWORD: ${{ secrets.SENIOR_JD_PASSWORD }}
        shell: bash
        run: |
          tar -C .sources/jd -czf "$RUNNER_TEMP/colora-jd-source.tar.gz" .
          node scripts/jd-source.mjs encrypt "$RUNNER_TEMP/colora-jd-source.tar.gz" modules/jd-source.enc.json
          node scripts/jd-source.mjs decrypt modules/jd-source.enc.json .sources/jd-verify
          echo "Rekey verification successful. The archive remains encrypted at rest."
      - name: Commit ciphertext only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- modules/jd-source.enc.json
          if git diff --cached --quiet; then
            echo "::error::Protected archive did not change."
            exit 1
          fi
          if [ "$(git diff --cached --name-only)" != "modules/jd-source.enc.json" ]; then
            echo "::error::Only the encrypted JD archive may be committed."
            exit 1
          fi
          git commit -m "chore: rekey protected JD archive after password rotation"
          git push origin HEAD:main
      - name: Trigger current individual-account deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ vars.STAFF_AUTH_MODE }}" != "static-accounts" ]; then
            echo "::error::The individual-account auth mode is not active; refusing to deploy an unexpected gateway."
            exit 1
          fi
          gh workflow run deploy-accounts.yml --ref main -R "$GITHUB_REPOSITORY"
      - name: Remove temporary plaintext files
        if: always()
        shell: bash
        run: |
          rm -rf .sources/jd .sources/jd-verify
          rm -f "$RUNNER_TEMP/colora-jd-source.tar.gz"
